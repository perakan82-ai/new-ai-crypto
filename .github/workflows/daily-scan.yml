name: Daily Crypto Scan

on:
  schedule:
    # 05:07 เวลาไทย (UTC+7) = 22:07 UTC ของวันก่อนหน้า
    - cron: "7 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # บันทึก data/plans.json ให้ระบบแจ้งเตือนทุก 4 ชม. ใช้

concurrency:
  group: repo-data
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_WATCH: ${{ secrets.SCAN_WATCH }}
        run: python scripts/daily_scan.py

      - name: Save plans for alerts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && git add data/
          if git diff --cached --quiet; then echo "ไม่มีอะไรเปลี่ยน"; exit 0; fi
          git commit -m "chore: update plans [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
